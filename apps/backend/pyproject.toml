[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "super-ai-backend"
version = "0.1.0"
description = "安全单仓库后端基础骨架"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "pydantic>=2,<3",
  "uvicorn>=0.30,<1",
  "sqlalchemy[asyncio]>=2,<3",
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "pwdlib[argon2]>=0.2,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "httpx>=0.27,<1", "ruff>=0.9,<1", "pyright>=1.1.390,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/super_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.10"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
[tool.ruff.lint.per-file-ignores]
"src/super_ai/auth.py" = ["B008"]
"src/super_ai/main.py" = ["B008"]
